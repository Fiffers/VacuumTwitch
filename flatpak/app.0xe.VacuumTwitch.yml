app-id: app.0xe.VacuumTwitch
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: startvacuumtwitch
separate-locales: false

finish-args:
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: vacuumtwitch
    buildsystem: simple
    build-commands:
      - mkdir -p /app/vacuumtwitch
      - cp -a linux-unpacked/. /app/vacuumtwitch/
      - install -Dm755 startvacuumtwitch /app/bin/startvacuumtwitch
      - install -Dm644 app.0xe.VacuumTwitch.desktop /app/share/applications/app.0xe.VacuumTwitch.desktop
      - install -Dm644 app.0xe.VacuumTwitch.metainfo.xml /app/share/metainfo/app.0xe.VacuumTwitch.metainfo.xml
      - |
        for size in 16 32 48 64 128 256 512; do
          install -Dm644 "icons/${size}x${size}.png" \
            "/app/share/icons/hicolor/${size}x${size}/apps/app.0xe.VacuumTwitch.png"
        done
    sources:
      - type: dir
        path: ../dist
      - type: dir
        path: ../assets/icons
        dest: icons
      - type: file
        path: app.0xe.VacuumTwitch.desktop
      - type: file
        path: app.0xe.VacuumTwitch.metainfo.xml
      - type: script
        dest-filename: startvacuumtwitch
        commands:
          - exec zypak-wrapper /app/vacuumtwitch/VacuumTwitch "$@"
